name: Publicar XuperTV VIDAA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar archivos
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar solo la aplicación VIDAA
        run: |
          mkdir -p _site
          cp index.html app.js style.css _site/
          cp -R assets data _site/

      - name: Publicar artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar XuperTV
        id: deployment
        uses: actions/deploy-pages@v4
